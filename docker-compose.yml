services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-formen}
      POSTGRES_DB: ${POSTGRES_DB:-formen_takip}
    # Docker'ın varsayılan 64 MB /dev/shm'i, ~1.3M satırlık performans tablosunda
    # paralel sorgu worker'ları için yetmiyor ve aralıklı "DiskFull: could not
    # resize shared memory segment" hatalarına yol açıyor (host diskiyle ilgisi yok).
    shm_size: 1gb
    volumes:
      - formen_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-formen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-formen}:${POSTGRES_PASSWORD:-formen}@postgres:5432/${POSTGRES_DB:-formen_takip}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  formen_pg_data:
